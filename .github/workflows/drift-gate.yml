name: drift-gate
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Derived files match the canonical source
        run: python3 tools/build.py --check
      - name: Checksums match the files on disk
        run: sha256sum --check data/derived.sha256
